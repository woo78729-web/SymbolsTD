<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101614" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="直式塔防小遊戲，可透過 Capacitor 打包，並預留 Google AdMob 獎勵與插頁廣告。" />
  <title>幻想 TD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h1 class="sr-only">幻想 TD</h1>

    <section id="screen-welcome" class="screen screen-welcome">
      <div class="welcome-stage">
        <div class="welcome-art">
          <img class="welcome-bg" src="assets/ui/bg-welcome-v7.jpg?v=8" alt="" aria-hidden="true" draggable="false" />
          <img class="welcome-logo" src="assets/ui/logo-symbols-td.png?v=8" alt="SymbolsTD" />
          <button type="button" class="welcome-start" id="btn-welcome-start" aria-label="開始遊戲">
            <img src="assets/ui/btn-start.png?v=8" alt="開始遊戲" />
          </button>
        </div>
      </div>
    </section>

    <section id="screen-menu" class="screen screen-menu" hidden>
      <div class="screen-head menu-head">
        <button type="button" class="icon-btn" id="btn-menu-back" aria-label="返回歡迎頁">‹</button>
        <div>
          <p class="screen-kicker">幻想 TD</p>
          <h2>目錄</h2>
        </div>
      </div>
      <div class="menu-actions">
        <button type="button" class="doodle-btn" id="btn-mode-campaign" aria-label="關卡爬塔">
          <img src="assets/ui/btn-mode-campaign.png" alt="關卡爬塔" />
        </button>
        <button type="button" class="doodle-btn" id="btn-mode-custom" aria-label="自訂路線">
          <img src="assets/ui/btn-mode-custom.png" alt="自訂路線" />
        </button>
        <button type="button" class="doodle-btn" id="btn-mode-infinite" aria-label="無限隨機">
          <img src="assets/ui/btn-mode-infinite.png" alt="無限隨機" />
        </button>
        <button type="button" class="doodle-btn" id="btn-open-codex" aria-label="怪圖鑑">
          <img src="assets/ui/btn-codex.png" alt="怪圖鑑" />
        </button>
        <button type="button" class="doodle-btn" id="btn-open-towers" aria-label="塔明細">
          <img src="assets/ui/btn-towers.png" alt="塔明細" />
        </button>
        <button type="button" class="doodle-btn" id="btn-open-hell" aria-label="地獄詞綴">
          <img src="assets/ui/btn-hell-deff.png?v=4" alt="地獄詞綴" />
        </button>
      </div>
    </section>

    <section id="screen-hell" class="screen screen-info" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-hell-back" aria-label="返回">‹</button>
        <div>
          <p class="screen-kicker">圖鑑</p>
          <h2>地獄詞綴</h2>
        </div>
      </div>
      <p class="screen-note">地獄難度會疊加詞綴。毒克制回血，火克制厚皮。</p>
      <div id="hell-info-list" class="info-list"></div>
    </section>

    <section id="screen-codex" class="screen screen-info" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-codex-back" aria-label="返回">‹</button>
        <div>
          <p class="screen-kicker">圖鑑</p>
          <h2>怪圖鑑</h2>
        </div>
      </div>
      <p class="screen-note">先看清楚怪的特性與克制，再開戰。</p>
      <div id="codex-list" class="info-list"></div>
    </section>

    <section id="screen-towers" class="screen screen-info" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-towers-back" aria-label="返回">‹</button>
        <div>
          <p class="screen-kicker">圖鑑</p>
          <h2>塔明細</h2>
        </div>
      </div>
      <p class="screen-note">各塔效果、分支與克制一覽。</p>
      <div id="tower-info-list" class="info-list"></div>
    </section>

    <section id="screen-difficulty" class="screen" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-difficulty-back" aria-label="返回選單">‹</button>
        <div>
          <p class="screen-kicker" id="difficulty-kicker">無限隨機模式</p>
          <h2>選擇難度</h2>
        </div>
      </div>
      <p class="screen-note" id="difficulty-note">開局隨機地圖後固定路線。普通與地獄分開記錄最遠波次。</p>
      <div id="difficulty-list"></div>
    </section>
    <section id="screen-chapters" class="screen" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-chapters-back" aria-label="返回選單">‹</button>
        <div>
          <p class="screen-kicker">世界</p>
          <h2>選擇章節</h2>
        </div>
      </div>
      <p class="screen-note">由下往上。通過本章第 5 關後解鎖下一章。</p>
      <div id="chapter-list" class="chapter-list"></div>
    </section>
    <section id="screen-stages" class="screen" hidden>
      <div class="screen-head">
        <button type="button" class="icon-btn" id="btn-stages-back" aria-label="返回章節">‹</button>
        <div>
          <p class="screen-kicker" id="stage-kicker">章節</p>
          <h2 id="stage-title">關卡</h2>
        </div>
      </div>
      <p class="screen-note" id="stage-note"></p>
      <div id="stage-track" class="stage-track"></div>
    </section>
    <header class="hud">
      <button type="button" class="icon-btn" id="btn-back" aria-label="返回選單">‹</button>
      <div class="stat stat-life" id="stat-life">
        <span class="stat-value" id="hud-lives">20</span>
        <span class="stat-label">生命</span>
      </div>
      <div class="stat stat-wave">
        <span class="stat-value" id="hud-wave">準備</span>
        <span class="stat-label" id="hud-wave-sub">放置防禦塔</span>
      </div>
      <div class="stat stat-gold">
        <span class="stat-value" id="hud-gold">140</span>
        <span class="stat-label">金幣</span>
      </div>
      <button type="button" class="icon-btn" id="btn-pause" aria-pressed="false" aria-label="暫停">
        <img class="hud-ico" src="assets/ui/btn-pause.png" alt="" />
      </button>
      <button type="button" class="icon-btn" id="btn-sound" aria-pressed="false" aria-label="關閉音效">♪</button>
    </header>

    <main class="stage" id="stage">
      <canvas id="game" width="360" height="520" aria-label="塔防戰場"></canvas>
      <section class="inspector" id="inspector" aria-live="polite">
        <div class="inspector-inner">
          <div class="inspector-copy">
            <h2 id="inspect-title">防禦塔</h2>
            <p id="inspect-meta"></p>
          </div>
          <div class="inspector-actions" id="inspect-actions"></div>
        </div>
      </section>
    </main>

    <div id="route-bar" class="route-bar" hidden>
      <button type="button" class="tile-btn" data-tile="straight">直線 <b id="tile-straight">0</b></button>
      <button type="button" class="tile-btn" data-tile="turn">轉彎 <b id="tile-turn">0</b></button>
      <p class="route-hint" id="route-hint">每 5 波 +3 張，每 10 波可改道</p>
    </div>

    <div id="item-bar" class="item-bar">
      <button type="button" id="btn-item-wall">阻擋 <b id="item-wall">0</b></button>
      <button type="button" id="btn-item-push">擊退 <b id="item-push">0</b></button>
    </div>

    <footer class="dock">
      <button type="button" class="speed-btn" id="btn-speed" aria-label="一倍速">×1</button>
      <button type="button" class="wave-btn" id="btn-wave">
        <span id="wave-btn-label">開始第 1 波</span>
        <small id="wave-btn-sub">準備就緒</small>
      </button>
    </footer>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p class="modal-kicker" id="modal-kicker"></p>
      <h2 id="modal-title"></h2>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="admob-bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
